name: Yuanxiaoer post collection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yuanxiaoer-collect.yml
      - tools/fetch_yuanxiaoer_posts.py
  schedule:
    # 21:00 Asia/Shanghai (GitHub Actions schedules use UTC).
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yuanxiaoer-post-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect every author-feed page and active thread
        id: collect
        continue-on-error: true
        run: python tools/fetch_yuanxiaoer_posts.py

      - name: Commit collection and pending queue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yuanxiaoer/latest_run.json data/yuanxiaoer/pending_distillation.json data/yuanxiaoer/posts data/yuanxiaoer/versions
          if git diff --cached --quiet; then
            echo "No collection files changed."
            exit 0
          fi
          git commit -m "Update Yuanxiaoer post collection"
          git push origin HEAD:main

      - name: Mark incomplete collection as failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
