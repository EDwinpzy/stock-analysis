          os.makedirs(root, exist_ok=True)
          for env_name, file_name in (
              ("TGB_COOKIE_GZ_B64", "tgb_cookies.json"),
              ("DOUYIN_COOKIE_GZ_B64", "douyin_cookies.json"),
              ("XUEQIU_COOKIE_GZ_B64", "xueqiu_cookies.json"),
          ):
              encoded = os.environ.get(env_name, "").strip()
              if not encoded:
                  continue
              payload = gzip.decompress(base64.b64decode(encoded))
              with open(os.path.join(root, file_name), "wb") as handle:
                  handle.write(payload)
          os.chmod(root, 0o755)
          for name in os.listdir(root):
              os.chmod(os.path.join(root, name), 0o644)
          PY

      - name: Build the formal ARM64 image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/arm64 \
            -f plugins/daily-briefing-pro/deploy/cloud/Dockerfile \
            -t "$IMAGE" \
            plugins/daily-briefing-pro
          docker image inspect "$IMAGE" --format '{{.Architecture}} {{.Os}} {{.Id}}'

      - name: Prepare artifact directories
        run: |
          mkdir -p artifacts-arm64/data artifacts-arm64/reports/stock artifacts-arm64/reports/industry artifacts-arm64/visuals
          chmod 777 artifacts-arm64/data artifacts-arm64/reports artifacts-arm64/reports/stock artifacts-arm64/reports/industry artifacts-arm64/visuals

      - name: Probe credentials and data channels
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --volume "$PWD/artifacts-arm64/data:/runtime/data" \
            --volume "$PWD/artifacts-arm64/reports:/runtime/reports" \
            "$IMAGE" \
