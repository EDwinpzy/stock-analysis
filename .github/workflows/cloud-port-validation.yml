name: Cloud port validation

on:
  push:
    branches:
      - codex/cloud-plugin-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-port-validation
  cancel-in-progress: false

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the task branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r plugins/daily-briefing-pro/deploy/cloud/requirements-cloud.txt
          python -m pip install --no-deps "py-mini-racer==0.6.0" "akshare==1.18.46"

      - name: Compile Python sources
        run: python -m compileall -q plugins tests

      - name: Run the complete test suite
        run: python -m pytest -q

  container-reports:
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      IMAGE: daily-briefing-pro:3.23.19-cloud-amd64-ci
      FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
      IWENCAI_API_KEY: ${{ secrets.IWENCAI_API_KEY }}
      DAILY_BRIEFING_AI_BASE_URL: ${{ secrets.DAILY_BRIEFING_AI_BASE_URL }}
      DAILY_BRIEFING_AI_API_KEY: ${{ secrets.DAILY_BRIEFING_AI_API_KEY }}
      DAILY_BRIEFING_AI_MODEL: ${{ secrets.DAILY_BRIEFING_AI_MODEL }}
      DAILY_BRIEFING_AI_FALLBACK_MODEL: ${{ secrets.DAILY_BRIEFING_AI_FALLBACK_MODEL }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      DEEPSEEK_FALLBACK_MODEL: ${{ secrets.DEEPSEEK_FALLBACK_MODEL }}
      DOUYIN_ASR_BASE_URL: ${{ secrets.DOUYIN_ASR_BASE_URL }}
      DOUYIN_ASR_API_KEY: ${{ secrets.DOUYIN_ASR_API_KEY }}
      DOUYIN_ASR_MODEL: ${{ secrets.DOUYIN_ASR_MODEL }}
      TGB_COOKIE_GZ_B64: ${{ secrets.TGB_COOKIE_GZ_B64 }}
      DOUYIN_COOKIE_GZ_B64: ${{ secrets.DOUYIN_COOKIE_GZ_B64 }}
      XUEQIU_COOKIE_GZ_B64: ${{ secrets.XUEQIU_COOKIE_GZ_B64 }}
    steps:
      - name: Check out the task branch
        uses: actions/checkout@v4

      - name: Prepare private runtime environment
        run: |
          set -euo pipefail
          umask 077
          env_file="$RUNNER_TEMP/briefing.env"
          : > "$env_file"
          for name in \
            FUYAO_API_KEY IWENCAI_API_KEY \
            DAILY_BRIEFING_AI_BASE_URL DAILY_BRIEFING_AI_API_KEY \
            DAILY_BRIEFING_AI_MODEL DAILY_BRIEFING_AI_FALLBACK_MODEL \
            DEEPSEEK_BASE_URL DEEPSEEK_API_KEY DEEPSEEK_MODEL \
            DEEPSEEK_FALLBACK_MODEL \
            DOUYIN_ASR_BASE_URL DOUYIN_ASR_API_KEY DOUYIN_ASR_MODEL; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$env_file"
            fi
          done
          python - <<'PY'
          import base64
          import gzip
          import os

          root = os.path.join(os.environ["RUNNER_TEMP"], "briefing-secrets")
          os.makedirs(root, exist_ok=True)
          for env_name, file_name in (
              ("TGB_COOKIE_GZ_B64", "tgb_cookies.json"),
              ("DOUYIN_COOKIE_GZ_B64", "douyin_cookies.json"),
              ("XUEQIU_COOKIE_GZ_B64", "xueqiu_cookies.json"),
          ):
              encoded = os.environ.get(env_name, "").strip()
              if not encoded:
                  continue
              payload = gzip.decompress(base64.b64decode(encoded))
              with open(os.path.join(root, file_name), "wb") as handle:
                  handle.write(payload)
          os.chmod(root, 0o755)
          for name in os.listdir(root):
              os.chmod(os.path.join(root, name), 0o644)
          PY

      - name: Build the formal AMD64 image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/amd64 \
            -f plugins/daily-briefing-pro/deploy/cloud/Dockerfile \
            -t "$IMAGE" \
            plugins/daily-briefing-pro
          docker image inspect "$IMAGE" --format '{{.Architecture}} {{.Os}} {{.Id}}'

      - name: Prepare artifact directories
        run: |
          mkdir -p artifacts/data artifacts/reports/stock artifacts/reports/industry artifacts/visuals
          chmod 777 artifacts/data artifacts/reports artifacts/reports/stock artifacts/reports/industry artifacts/visuals

      - name: Probe credentials and data channels
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --volume "$PWD/artifacts/data:/runtime/data" \
            --volume "$PWD/artifacts/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py doctor --probe \
            | tee artifacts/doctor.json

      - name: Query live market data
        run: |
          set -euo pipefail
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" --env FUYAO_API_KEY "$IMAGE" \
            python /opt/daily-briefing-pro/skills/market-query/scripts/market_query.py \
            realtime 600519 --mode cloud --compact \
            | tee artifacts/market-realtime.json
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" --env FUYAO_API_KEY "$IMAGE" \
            python /opt/daily-briefing-pro/skills/market-query/scripts/market_query.py \
            candle 600519 --mode cloud --count 3 --compact \
            | tee artifacts/market-candle.json
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" --env FUYAO_API_KEY "$IMAGE" \
            python /opt/daily-briefing-pro/skills/market-query/scripts/market_query.py \
            sector --target 白酒 --mode cloud --compact \
            | tee artifacts/market-sector.json

      - name: Generate and gate the stock report
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/stock \
            --volume "$PWD/artifacts/data:/runtime/data" \
            --volume "$PWD/artifacts/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py stock-report 600519 \
            --output-dir /runtime/data/stock-analysis \
            | tee artifacts/stock-report-result.json

      - name: Generate and gate the industry report
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/industry \
            --volume "$PWD/artifacts/data:/runtime/data" \
            --volume "$PWD/artifacts/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py industry-report 白酒 \
            --output-dir /runtime/data/industry-analysis \
            | tee artifacts/industry-report-result.json

      - name: Generate complete reports without a Wencai key
        run: |
          set -euo pipefail
          mkdir -p artifacts/no-wencai/data \
            artifacts/no-wencai/reports/stock \
            artifacts/no-wencai/reports/industry \
            artifacts/no-wencai/visuals
          chmod 777 artifacts/no-wencai/data artifacts/no-wencai/reports \
            artifacts/no-wencai/reports/stock artifacts/no-wencai/reports/industry \
            artifacts/no-wencai/visuals
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env IWENCAI_API_KEY=' ' \
            --env WENCAI_API_KEY=' ' \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/stock \
            --volume "$PWD/artifacts/no-wencai/data:/runtime/data" \
            --volume "$PWD/artifacts/no-wencai/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py stock-report 600519 \
            --output-dir /runtime/data/stock-analysis \
            | tee artifacts/no-wencai/stock-report-result.json
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env IWENCAI_API_KEY=' ' \
            --env WENCAI_API_KEY=' ' \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/industry \
            --volume "$PWD/artifacts/no-wencai/data:/runtime/data" \
            --volume "$PWD/artifacts/no-wencai/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py industry-report 白酒 \
            --output-dir /runtime/data/industry-analysis \
            | tee artifacts/no-wencai/industry-report-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/no-wencai/data/stock-analysis/_fetch_result_600519.json")
              .read_text(encoding="utf-8")
          )
          assert payload.get("wencai_available") is False, payload.get("wencai_available")
          assert payload.get("product_source") == "eastmoney", payload.get("product_source")
          assert payload.get("finance_source") in {"eastmoney", "mixed"}
          assert payload.get("big_orders_source") in {"eastmoney", "thsdk"}
          assert payload.get("big_orders_scope") in {
              "daily_net_flow", "daily_aggregate", "tick"
          }
          PY
          docker run --rm \
            --volume "$PWD/artifacts/no-wencai/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/no-wencai/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/stock \
            --sections 10 --tables 25 --label stock-no-wencai \
            --shots /runtime/visuals \
            --json /runtime/visuals/stock-no-wencai-visual-result.json
          docker run --rm \
            --volume "$PWD/artifacts/no-wencai/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/no-wencai/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/industry \
            --sections 8 --tables 14 --label industry-no-wencai \
            --shots /runtime/visuals \
            --json /runtime/visuals/industry-no-wencai-visual-result.json

      - name: Render desktop and mobile report screenshots
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD/artifacts/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/stock \
            --sections 10 --tables 25 --label stock \
            --shots /runtime/visuals \
            --json /runtime/visuals/stock-visual-result.json
          docker run --rm \
            --volume "$PWD/artifacts/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/industry \
            --sections 8 --tables 14 --label industry \
            --shots /runtime/visuals \
            --json /runtime/visuals/industry-visual-result.json

      - name: Replay the fixed 2026-11-11 briefing
        run: |
          set -euo pipefail
          test "$(sha256sum tests/fixtures/cloud-replay-2026-11-11.tar.gz | awk '{print $1}')" = \
            "913c784f8e4f1ecb4443cedaf69094b9885989bfd76c01196912a918cffba329"
          mkdir -p artifacts/replay/data artifacts/replay/reports
          tar -xzf tests/fixtures/cloud-replay-2026-11-11.tar.gz \
            -C artifacts/replay/data --strip-components=1
          chmod -R 777 artifacts/replay
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env DAILY_BRIEFING_DATA_DIR=/runtime/data \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports \
            --volume "$PWD/artifacts/replay/data:/runtime/data" \
            --volume "$PWD/artifacts/replay/reports:/runtime/reports" \
            "$IMAGE" \
            sh /opt/daily-briefing-pro/deploy/cloud/verify-fixed-replay.sh 2026-11-11

      - name: Upload report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-port-evidence
          if-no-files-found: error
          retention-days: 14
          path: artifacts/

  arm64-reports:
    needs: python-tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      IMAGE: daily-briefing-pro:3.23.19-cloud-arm64-ci
      FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
      IWENCAI_API_KEY: ${{ secrets.IWENCAI_API_KEY }}
