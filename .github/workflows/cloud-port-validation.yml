          mkdir -p artifacts-arm64/replay/data artifacts-arm64/replay/reports
          tar -xzf tests/fixtures/cloud-replay-2026-11-11.tar.gz \
            -C artifacts-arm64/replay/data --strip-components=1
          chmod -R 777 artifacts-arm64/replay
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env DAILY_BRIEFING_DATA_DIR=/runtime/data \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports \
