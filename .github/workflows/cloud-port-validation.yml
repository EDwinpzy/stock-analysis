name: Cloud port validation

on:
  push:
    branches:
      - codex/cloud-plugin-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-port-validation
  cancel-in-progress: false

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the task branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r plugins/daily-briefing-pro/deploy/cloud/requirements-cloud.txt
          python -m pip install --no-deps "py-mini-racer==0.6.0" "akshare==1.18.46"

      - name: Compile Python sources
        run: python -m compileall -q plugins tests

      - name: Run the complete test suite
        run: python -m pytest -q

  container-reports:
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      IMAGE: daily-briefing-pro:3.23.19-cloud-amd64-ci
      FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
      IWENCAI_API_KEY: ${{ secrets.IWENCAI_API_KEY }}
      DAILY_BRIEFING_AI_BASE_URL: ${{ secrets.DAILY_BRIEFING_AI_BASE_URL }}
      DAILY_BRIEFING_AI_API_KEY: ${{ secrets.DAILY_BRIEFING_AI_API_KEY }}
      DAILY_BRIEFING_AI_MODEL: ${{ secrets.DAILY_BRIEFING_AI_MODEL }}
      DAILY_BRIEFING_AI_FALLBACK_MODEL: ${{ secrets.DAILY_BRIEFING_AI_FALLBACK_MODEL }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      DEEPSEEK_FALLBACK_MODEL: ${{ secrets.DEEPSEEK_FALLBACK_MODEL }}
      DOUYIN_ASR_BASE_URL: ${{ secrets.DOUYIN_ASR_BASE_URL }}
      DOUYIN_ASR_API_KEY: ${{ secrets.DOUYIN_ASR_API_KEY }}
      DOUYIN_ASR_MODEL: ${{ secrets.DOUYIN_ASR_MODEL }}
      DOUYIN_RESOLVER_BASE_URL: ${{ secrets.DOUYIN_RESOLVER_BASE_URL }}
      DOUYIN_RESOLVER_API_KEY: ${{ secrets.DOUYIN_RESOLVER_API_KEY }}
      DOUYIN_RESOLVER_USERNAME: ${{ secrets.DOUYIN_RESOLVER_USERNAME }}
      DOUYIN_RESOLVER_PASSWORD: ${{ secrets.DOUYIN_RESOLVER_PASSWORD }}
      DOUYIN_TRANSCRIPT_PROVIDER: auto
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STT_AI_API_KEY: ${{ secrets.STT_AI_API_KEY }}
      TGB_COOKIE_GZ_B64: ${{ secrets.TGB_COOKIE_GZ_B64 }}
      DOUYIN_COOKIE_GZ_B64: ${{ secrets.DOUYIN_COOKIE_GZ_B64 }}
      XUEQIU_COOKIE_GZ_B64: ${{ secrets.XUEQIU_COOKIE_GZ_B64 }}
    steps:
      - name: Check out the task branch
        uses: actions/checkout@v4

      - name: Prepare private runtime environment
        run: |
          set -euo pipefail
          umask 077
          env_file="$RUNNER_TEMP/briefing.env"
          : > "$env_file"
          for name in \
            FUYAO_API_KEY IWENCAI_API_KEY \
            DAILY_BRIEFING_AI_BASE_URL DAILY_BRIEFING_AI_API_KEY \
            DAILY_BRIEFING_AI_MODEL DAILY_BRIEFING_AI_FALLBACK_MODEL \
            DEEPSEEK_BASE_URL DEEPSEEK_API_KEY DEEPSEEK_MODEL \
            DEEPSEEK_FALLBACK_MODEL \
            DOUYIN_ASR_BASE_URL DOUYIN_ASR_API_KEY DOUYIN_ASR_MODEL \
            DOUYIN_RESOLVER_BASE_URL DOUYIN_RESOLVER_API_KEY \
            DOUYIN_RESOLVER_USERNAME DOUYIN_RESOLVER_PASSWORD \
            GROQ_API_KEY SILICONFLOW_API_KEY OPENAI_API_KEY STT_AI_API_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$env_file"
            fi
          done
          python - <<'PY'
          import base64
          import gzip
          import os

          root = os.path.join(os.environ["RUNNER_TEMP"], "briefing-secrets")
          os.makedirs(root, exist_ok=True)
          for env_name, file_name in (
              ("TGB_COOKIE_GZ_B64", "tgb_cookies.json"),
              ("DOUYIN_COOKIE_GZ_B64", "douyin_cookies.json"),
              ("XUEQIU_COOKIE_GZ_B64", "xueqiu_cookies.json"),
          ):
              encoded = os.environ.get(env_name, "").strip()
              if not encoded:
                  continue
              payload = gzip.decompress(base64.b64decode(encoded))
              with open(os.path.join(root, file_name), "wb") as handle:
                  handle.write(payload)
          os.chmod(root, 0o755)
          for name in os.listdir(root):
              os.chmod(os.path.join(root, name), 0o644)
          PY

      - name: Build the formal AMD64 image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/amd64 \
            -f plugins/daily-briefing-pro/deploy/cloud/Dockerfile \
            -t "$IMAGE" \
            plugins/daily-briefing-pro
          docker image inspect "$IMAGE" --format '{{.Architecture}} {{.Os}} {{.Id}}'

      - name: Prepare artifact directories
        run: |
          mkdir -p artifacts/data artifacts/reports/stock artifacts/reports/industry artifacts/visuals
          chmod 777 artifacts/data artifacts/reports artifacts/reports/stock artifacts/reports/industry artifacts/visuals

      - name: Probe credentials and data channels
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --volume "$PWD/artifacts/data:/runtime/data" \
            --volume "$PWD/artifacts/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py doctor --probe \
            | tee artifacts/doctor.json

      - name: Query live market data
        run: |
          set -euo pipefail
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" --env FUYAO_API_KEY "$IMAGE" \
            python /opt/daily-briefing-pro/skills/market-query/scripts/market_query.py \
            realtime 600519 --mode cloud --compact \
            | tee artifacts/market-realtime.json
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" --env FUYAO_API_KEY "$IMAGE" \
            python /opt/daily-briefing-pro/skills/market-query/scripts/market_query.py \
            candle 600519 --mode cloud --count 3 --compact \
            | tee artifacts/market-candle.json
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" --env FUYAO_API_KEY "$IMAGE" \
            python /opt/daily-briefing-pro/skills/market-query/scripts/market_query.py \
            sector --target 白酒 --mode cloud --compact \
            | tee artifacts/market-sector.json

      - name: Generate and gate the stock report
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/stock \
            --volume "$PWD/artifacts/data:/runtime/data" \
            --volume "$PWD/artifacts/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py stock-report 600519 \
            --output-dir /runtime/data/stock-analysis \
            | tee artifacts/stock-report-result.json

      - name: Generate and gate the industry report
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/industry \
            --volume "$PWD/artifacts/data:/runtime/data" \
            --volume "$PWD/artifacts/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py industry-report 白酒 \
            --output-dir /runtime/data/industry-analysis \
            | tee artifacts/industry-report-result.json

      - name: Gate report fields and stable business parity
        run: |
          set -euo pipefail
          stock_html="$(find artifacts/reports/stock -maxdepth 1 -type f -name '*.html' -print -quit)"
          industry_html="$(find artifacts/reports/industry -maxdepth 1 -type f -name '*.html' -print -quit)"
          test -n "$stock_html"
          test -n "$industry_html"
          docker run --rm \
            --volume "$PWD/artifacts/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/data:/runtime/data:ro" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_skill_report.py \
            "/runtime/reports/stock/$(basename "$stock_html")" \
            --type stock \
            --data-json /runtime/data/stock-analysis/_fetch_result_600519.json \
            | tee artifacts/stock-field-gate.json
          docker run --rm \
            --volume "$PWD/artifacts/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/data:/runtime/data:ro" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_skill_report.py \
            "/runtime/reports/industry/$(basename "$industry_html")" \
            --type industry \
            --data-json /runtime/data/industry-analysis/_industry_白酒.json \
            | tee artifacts/industry-field-gate.json
          python plugins/daily-briefing-pro/skills/daily-briefing-pro/scripts/compare_business_parity.py \
            --type stock \
            --local tests/fixtures/business-baseline/stock-600519-2026-11-12.json \
            --cloud artifacts/data/stock-analysis/_fetch_result_600519.json \
            | tee artifacts/stock-business-parity.json
          python plugins/daily-briefing-pro/skills/daily-briefing-pro/scripts/compare_business_parity.py \
            --type industry \
            --local tests/fixtures/business-baseline/industry-baijiu-2026-11-12.json \
            --cloud artifacts/data/industry-analysis/_industry_白酒.json \
            | tee artifacts/industry-business-parity.json

      - name: Generate complete reports without a Wencai key
        run: |
          set -euo pipefail
          mkdir -p artifacts/no-wencai/data \
            artifacts/no-wencai/reports/stock \
            artifacts/no-wencai/reports/industry \
            artifacts/no-wencai/visuals
          chmod 777 artifacts/no-wencai/data artifacts/no-wencai/reports \
            artifacts/no-wencai/reports/stock artifacts/no-wencai/reports/industry \
            artifacts/no-wencai/visuals
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env IWENCAI_API_KEY=' ' \
            --env WENCAI_API_KEY=' ' \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/stock \
            --volume "$PWD/artifacts/no-wencai/data:/runtime/data" \
            --volume "$PWD/artifacts/no-wencai/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py stock-report 600519 \
            --output-dir /runtime/data/stock-analysis \
            | tee artifacts/no-wencai/stock-report-result.json
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env IWENCAI_API_KEY=' ' \
            --env WENCAI_API_KEY=' ' \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/industry \
            --volume "$PWD/artifacts/no-wencai/data:/runtime/data" \
            --volume "$PWD/artifacts/no-wencai/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py industry-report 白酒 \
            --output-dir /runtime/data/industry-analysis \
            | tee artifacts/no-wencai/industry-report-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/no-wencai/data/stock-analysis/_fetch_result_600519.json")
              .read_text(encoding="utf-8")
          )
          assert payload.get("wencai_available") is False, payload.get("wencai_available")
          assert payload.get("product_source") == "eastmoney", payload.get("product_source")
          assert payload.get("finance_source") in {"eastmoney", "mixed"}
          assert payload.get("big_orders_source") in {"eastmoney", "thsdk"}
          assert payload.get("big_orders_scope") in {
              "daily_net_flow", "daily_aggregate", "tick"
          }
          PY
          docker run --rm \
            --volume "$PWD/artifacts/no-wencai/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/no-wencai/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/stock \
            --sections 10 --tables 25 --label stock-no-wencai \
            --shots /runtime/visuals \
            --json /runtime/visuals/stock-no-wencai-visual-result.json
          docker run --rm \
            --volume "$PWD/artifacts/no-wencai/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/no-wencai/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/industry \
            --sections 8 --tables 14 --label industry-no-wencai \
            --shots /runtime/visuals \
            --json /runtime/visuals/industry-no-wencai-visual-result.json

      - name: Render desktop and mobile report screenshots
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD/artifacts/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/stock \
            --sections 10 --tables 25 --label stock \
            --shots /runtime/visuals \
            --json /runtime/visuals/stock-visual-result.json
          docker run --rm \
            --volume "$PWD/artifacts/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/industry \
            --sections 8 --tables 14 --label industry \
            --shots /runtime/visuals \
            --json /runtime/visuals/industry-visual-result.json

      - name: Report the cloud ASR route
        run: |
          set -euo pipefail
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" "$IMAGE" \
            python -c "import os; generic=all(os.environ.get(k,'').strip() for k in ('DOUYIN_ASR_BASE_URL','DOUYIN_ASR_API_KEY','DOUYIN_ASR_MODEL')); native=[k for k in ('GROQ_API_KEY','SILICONFLOW_API_KEY','OPENAI_API_KEY','STT_AI_API_KEY') if os.environ.get(k,'').strip()]; print('ASR generic=%s native=%s sttai=anonymous notetakers=anonymous' % (generic, native))"

      - name: Generate the live scheduled briefing with real audio transcription
        run: |
          set -euo pipefail
          mkdir -p artifacts/briefing/data artifacts/briefing/reports
          chmod 777 artifacts/briefing/data artifacts/briefing/reports
          set +e
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env DEEPSEEK_API_KEY \
            --env DAILY_BRIEFING_AI_API_KEY \
            --env DAILY_BRIEFING_AI_BASE_URL \
            --env DAILY_BRIEFING_AI_MODEL \
            --env DEEPSEEK_BASE_URL \
            --env DEEPSEEK_MODEL \
            --env DAILY_BRIEFING_DATA_DIR=/runtime/data \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports \
            --env DAILY_BRIEFING_RUN_TIMEOUT=4800 \
            --env DOUYIN_TRANSCRIPT_PROVIDER=auto \
            --env DOUYIN_RESOLVER_ALLOW_DEMO=1 \
            --env DOUYIN_MAX_CONCURRENT=1 \
            --shm-size=1g \
            --volume "$PWD/artifacts/briefing/data:/runtime/data" \
            --volume "$PWD/artifacts/briefing/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py briefing --scheduled \
            > artifacts/briefing/run.log 2>&1
          rc=$?
          set -e
          cat artifacts/briefing/run.log
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          if grep -q '"status": "skipped"' artifacts/briefing/run.log; then
            echo "The scheduled run skipped; live report evidence is required" >&2
            exit 1
          fi
          source_html="$(find artifacts/briefing/reports -maxdepth 1 -type f -name '*简报.html' ! -name '*报刊版*' -print -quit)"
          broadsheet_html="$(find artifacts/briefing/reports -maxdepth 1 -type f -name '*报刊版.html' -print -quit)"
          test -s "$source_html"
          test -s "$broadsheet_html"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/briefing/data")
          douyin = json.loads((root / "douyin_today.json").read_text(encoding="utf-8"))
          assert douyin.get("status") == "ok", douyin.get("note") or douyin
          expected = int(douyin.get("expected_video_count") or 0)
          transcript_count = int(douyin.get("transcript_count") or 0)
          assert expected > 0, douyin
          assert transcript_count == expected, (transcript_count, expected)
          allowed_sources = {
              "douyin_subtitle",
              "verified_video_cache",
              "cloud-asr",
              "groq-whisper",
              "openai-asr",
              "siliconflow-sensevoice",
              "sttai-whisper",
              "notetakers-whisper",
          }
          for blogger in douyin.get("bloggers", []):
              for video in blogger.get("videos", []):
                  assert str(video.get("transcript") or "").strip(), video.get("url")
                  source = str(video.get("transcript_source") or "").strip()
                  assert source in allowed_sources, (video.get("url"), source)
          print(json.dumps({
              "douyin_status": douyin.get("status"),
              "expected_video_count": expected,
              "transcript_count": transcript_count,
              "source_briefing": str(Path("artifacts/briefing/reports")),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Replay the fixed 2026-11-11 briefing
        run: |
          set -euo pipefail
          test "$(sha256sum tests/fixtures/cloud-replay-2026-11-11.tar.gz | awk '{print $1}')" = \
            "913c784f8e4f1ecb4443cedaf69094b9885989bfd76c01196912a918cffba329"
          mkdir -p artifacts/replay/data artifacts/replay/reports
          tar -xzf tests/fixtures/cloud-replay-2026-11-11.tar.gz \
            -C artifacts/replay/data --strip-components=1
          chmod -R 777 artifacts/replay
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env DAILY_BRIEFING_DATA_DIR=/runtime/data \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports \
            --volume "$PWD/artifacts/replay/data:/runtime/data" \
            --volume "$PWD/artifacts/replay/reports:/runtime/reports" \
            "$IMAGE" \
            sh /opt/daily-briefing-pro/deploy/cloud/verify-fixed-replay.sh 2026-11-11

      - name: Normalize report evidence permissions
        if: always()
        run: sudo chmod -R a+rX artifacts || true

      - name: Upload report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-port-evidence
          if-no-files-found: error
          retention-days: 14
          path: artifacts/

  arm64-reports:
    needs: python-tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      IMAGE: daily-briefing-pro:3.23.19-cloud-arm64-ci
      FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
      IWENCAI_API_KEY: ${{ secrets.IWENCAI_API_KEY }}
      DAILY_BRIEFING_AI_BASE_URL: ${{ secrets.DAILY_BRIEFING_AI_BASE_URL }}
      DAILY_BRIEFING_AI_API_KEY: ${{ secrets.DAILY_BRIEFING_AI_API_KEY }}
      DAILY_BRIEFING_AI_MODEL: ${{ secrets.DAILY_BRIEFING_AI_MODEL }}
      DAILY_BRIEFING_AI_FALLBACK_MODEL: ${{ secrets.DAILY_BRIEFING_AI_FALLBACK_MODEL }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      DEEPSEEK_FALLBACK_MODEL: ${{ secrets.DEEPSEEK_FALLBACK_MODEL }}
      DOUYIN_ASR_BASE_URL: ${{ secrets.DOUYIN_ASR_BASE_URL }}
      DOUYIN_ASR_API_KEY: ${{ secrets.DOUYIN_ASR_API_KEY }}
      DOUYIN_ASR_MODEL: ${{ secrets.DOUYIN_ASR_MODEL }}
      DOUYIN_RESOLVER_BASE_URL: ${{ secrets.DOUYIN_RESOLVER_BASE_URL }}
      DOUYIN_RESOLVER_API_KEY: ${{ secrets.DOUYIN_RESOLVER_API_KEY }}
      DOUYIN_RESOLVER_USERNAME: ${{ secrets.DOUYIN_RESOLVER_USERNAME }}
      DOUYIN_RESOLVER_PASSWORD: ${{ secrets.DOUYIN_RESOLVER_PASSWORD }}
      DOUYIN_TRANSCRIPT_PROVIDER: auto
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STT_AI_API_KEY: ${{ secrets.STT_AI_API_KEY }}
      TGB_COOKIE_GZ_B64: ${{ secrets.TGB_COOKIE_GZ_B64 }}
      DOUYIN_COOKIE_GZ_B64: ${{ secrets.DOUYIN_COOKIE_GZ_B64 }}
      XUEQIU_COOKIE_GZ_B64: ${{ secrets.XUEQIU_COOKIE_GZ_B64 }}
    steps:
      - name: Check out the task branch
        uses: actions/checkout@v4

      - name: Prepare private runtime environment
        run: |
          set -euo pipefail
          umask 077
          env_file="$RUNNER_TEMP/briefing.env"
          : > "$env_file"
          for name in \
            FUYAO_API_KEY IWENCAI_API_KEY \
            DAILY_BRIEFING_AI_BASE_URL DAILY_BRIEFING_AI_API_KEY \
            DAILY_BRIEFING_AI_MODEL DAILY_BRIEFING_AI_FALLBACK_MODEL \
            DEEPSEEK_BASE_URL DEEPSEEK_API_KEY DEEPSEEK_MODEL \
            DEEPSEEK_FALLBACK_MODEL \
            DOUYIN_ASR_BASE_URL DOUYIN_ASR_API_KEY DOUYIN_ASR_MODEL \
            DOUYIN_RESOLVER_BASE_URL DOUYIN_RESOLVER_API_KEY \
            DOUYIN_RESOLVER_USERNAME DOUYIN_RESOLVER_PASSWORD \
            GROQ_API_KEY SILICONFLOW_API_KEY OPENAI_API_KEY STT_AI_API_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$env_file"
            fi
          done
          python - <<'PY'
          import base64
          import gzip
          import os

          root = os.path.join(os.environ["RUNNER_TEMP"], "briefing-secrets")
          os.makedirs(root, exist_ok=True)
          for env_name, file_name in (
              ("TGB_COOKIE_GZ_B64", "tgb_cookies.json"),
              ("DOUYIN_COOKIE_GZ_B64", "douyin_cookies.json"),
              ("XUEQIU_COOKIE_GZ_B64", "xueqiu_cookies.json"),
          ):
              encoded = os.environ.get(env_name, "").strip()
              if not encoded:
                  continue
              payload = gzip.decompress(base64.b64decode(encoded))
              with open(os.path.join(root, file_name), "wb") as handle:
                  handle.write(payload)
          os.chmod(root, 0o755)
          for name in os.listdir(root):
              os.chmod(os.path.join(root, name), 0o644)
          PY

      - name: Build the formal ARM64 image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/arm64 \
            -f plugins/daily-briefing-pro/deploy/cloud/Dockerfile \
            -t "$IMAGE" \
            plugins/daily-briefing-pro
          docker image inspect "$IMAGE" --format '{{.Architecture}} {{.Os}} {{.Id}}'

      - name: Prepare artifact directories
        run: |
          mkdir -p artifacts-arm64/data artifacts-arm64/reports/stock artifacts-arm64/reports/industry artifacts-arm64/visuals
          chmod 777 artifacts-arm64/data artifacts-arm64/reports artifacts-arm64/reports/stock artifacts-arm64/reports/industry artifacts-arm64/visuals

      - name: Probe credentials and data channels
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --volume "$PWD/artifacts-arm64/data:/runtime/data" \
            --volume "$PWD/artifacts-arm64/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py doctor --probe \
            | tee artifacts-arm64/doctor.json

      - name: Query live market data
        run: |
          set -euo pipefail
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" --env FUYAO_API_KEY "$IMAGE" \
            python /opt/daily-briefing-pro/skills/market-query/scripts/market_query.py \
            realtime 600519 --mode cloud --compact \
            | tee artifacts-arm64/market-realtime.json
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" --env FUYAO_API_KEY "$IMAGE" \
            python /opt/daily-briefing-pro/skills/market-query/scripts/market_query.py \
            candle 600519 --mode cloud --count 3 --compact \
            | tee artifacts-arm64/market-candle.json
          docker run --rm --env-file "$RUNNER_TEMP/briefing.env" --env FUYAO_API_KEY "$IMAGE" \
            python /opt/daily-briefing-pro/skills/market-query/scripts/market_query.py \
            sector --target 白酒 --mode cloud --compact \
            | tee artifacts-arm64/market-sector.json

      - name: Generate and gate the stock report
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/stock \
            --volume "$PWD/artifacts-arm64/data:/runtime/data" \
            --volume "$PWD/artifacts-arm64/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py stock-report 600519 \
            --output-dir /runtime/data/stock-analysis \
            | tee artifacts-arm64/stock-report-result.json

      - name: Generate and gate the industry report
        run: |
          set -euo pipefail
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env FUYAO_API_KEY \
            --env IWENCAI_API_KEY \
            --env DAILY_BRIEFING_COLLECT_TIMEOUT=900 \
            --env DAILY_BRIEFING_BUILD_TIMEOUT=300 \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports/industry \
            --volume "$PWD/artifacts-arm64/data:/runtime/data" \
            --volume "$PWD/artifacts-arm64/reports:/runtime/reports" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/cloud_cli.py industry-report 白酒 \
            --output-dir /runtime/data/industry-analysis \
            | tee artifacts-arm64/industry-report-result.json

      - name: Gate report fields and stable business parity (ARM64)
        run: |
          set -euo pipefail
          stock_html="$(find artifacts-arm64/reports/stock -maxdepth 1 -type f -name '*.html' -print -quit)"
          industry_html="$(find artifacts-arm64/reports/industry -maxdepth 1 -type f -name '*.html' -print -quit)"
          test -n "$stock_html"
          test -n "$industry_html"
          docker run --rm \
            --volume "$PWD/artifacts-arm64/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts-arm64/data:/runtime/data:ro" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_skill_report.py \
            "/runtime/reports/stock/$(basename "$stock_html")" \
            --type stock \
            --data-json /runtime/data/stock-analysis/_fetch_result_600519.json \
            | tee artifacts-arm64/stock-field-gate.json
          docker run --rm \
            --volume "$PWD/artifacts-arm64/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts-arm64/data:/runtime/data:ro" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_skill_report.py \
            "/runtime/reports/industry/$(basename "$industry_html")" \
            --type industry \
            --data-json /runtime/data/industry-analysis/_industry_白酒.json \
            | tee artifacts-arm64/industry-field-gate.json
          python plugins/daily-briefing-pro/skills/daily-briefing-pro/scripts/compare_business_parity.py \
            --type stock \
            --local tests/fixtures/business-baseline/stock-600519-2026-11-12.json \
            --cloud artifacts-arm64/data/stock-analysis/_fetch_result_600519.json \
            | tee artifacts-arm64/stock-business-parity.json
          python plugins/daily-briefing-pro/skills/daily-briefing-pro/scripts/compare_business_parity.py \
            --type industry \
            --local tests/fixtures/business-baseline/industry-baijiu-2026-11-12.json \
            --cloud artifacts-arm64/data/industry-analysis/_industry_白酒.json \
            | tee artifacts-arm64/industry-business-parity.json

      - name: Render desktop and mobile report screenshots
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD/artifacts-arm64/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts-arm64/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/stock \
            --sections 10 --tables 25 --label stock \
            --shots /runtime/visuals \
            --json /runtime/visuals/stock-visual-result.json
          docker run --rm \
            --volume "$PWD/artifacts-arm64/reports:/runtime/reports:ro" \
            --volume "$PWD/artifacts-arm64/visuals:/runtime/visuals" \
            "$IMAGE" \
            python /opt/daily-briefing-pro/skills/daily-briefing-pro/scripts/verify_cloud_report.py \
            --report-dir /runtime/reports/industry \
            --sections 8 --tables 14 --label industry \
            --shots /runtime/visuals \
            --json /runtime/visuals/industry-visual-result.json

      - name: Replay the fixed 2026-11-11 briefing
        run: |
          set -euo pipefail
          test "$(sha256sum tests/fixtures/cloud-replay-2026-11-11.tar.gz | awk '{print $1}')" = \
            "913c784f8e4f1ecb4443cedaf69094b9885989bfd76c01196912a918cffba329"
          mkdir -p artifacts-arm64/replay/data artifacts-arm64/replay/reports
          tar -xzf tests/fixtures/cloud-replay-2026-11-11.tar.gz \
            -C artifacts-arm64/replay/data --strip-components=1
          chmod -R 777 artifacts-arm64/replay
          docker run --rm \
            --env-file "$RUNNER_TEMP/briefing.env" \
            --volume "$RUNNER_TEMP/briefing-secrets:/run/secrets:ro" \
            --env DAILY_BRIEFING_DATA_DIR=/runtime/data \
            --env BRIEFING_OUTPUT_DIR=/runtime/reports \
            --volume "$PWD/artifacts-arm64/replay/data:/runtime/data" \
            --volume "$PWD/artifacts-arm64/replay/reports:/runtime/reports" \
            "$IMAGE" \
            sh /opt/daily-briefing-pro/deploy/cloud/verify-fixed-replay.sh 2026-11-11

      - name: Normalize ARM64 evidence permissions
        if: always()
        run: sudo chmod -R a+rX artifacts-arm64 || true

      - name: Upload ARM64 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-port-evidence-arm64
          if-no-files-found: error
          retention-days: 14
          path: artifacts-arm64/
